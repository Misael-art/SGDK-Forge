/* QA-only keyboard extension. BlastEm merges this file with its packaged
   defaults; P1 keeps arrows/A-S-D/Return and P2 gets an independent cluster. */
bindings {
	keys {
		i gamepads.2.up
		k gamepads.2.down
		j gamepads.2.left
		l gamepads.2.right
		x gamepads.2.a
		g gamepads.2.b
		h gamepads.2.c
		y gamepads.2.x
		t gamepads.2.y
		n gamepads.2.z
		f2 gamepads.2.start
	}
}
