interface:
  display_name: "Art Translation to VDP"
  short_description: "Traduz imagem-fonte forte para recurso real de VDP"
  brand_color: "#7A5A1B"
  default_prompt: "Use $art-translation-to-vdp para reinterpretar esta imagem-fonte como recurso de VDP, preservando a alma visual e provando o salto entre uma traducao basic e uma traducao elite. Se o projeto ja tiver builder ou case manifest curado em tools/image-tools/doc/source_cases, reutilize essa rota antes de OCR ou crop manual."

policy:
  allow_implicit_invocation: true

dependencies:
  tools: []
