  <text x="640" y="871" class="cardTitle">MUGEN SFF SHOWDOWN</text>
  <text x="640" y="899" class="status" fill="#f3b65f">LAB / PALETA E BUDGET PENDENTES</text>
  <text x="640" y="930" class="body">SFF/DEF → mundo recomposto → tiles/dedup/flip →</text>
  <text x="640" y="954" class="body">bins → viewer SGDK → fonte/export/BlastEm.</text>
  <text x="640" y="981" class="small">Lição: tiles na ROM não equivalem ao budget residente em VRAM.</text>

  <rect x="1204" y="594" width="560" height="410" rx="18" fill="#262c40" stroke="#ff6f91" stroke-width="3"/>
  <rect x="1224" y="622" width="520" height="210" rx="12" fill="#111522"/>
  <image x="1224" y="622" width="520" height="210" preserveAspectRatio="xMidYMid meet" clip-path="url(#c6)"
    href="file:///mnt/sdcard/SGDKForge/SGDK_projects/KIRBY_FAN%20GAME%20CLOUDE%20%5BVER.001%5D%20%5BSGDK%20211%5D%20%5BGEN%5D%20%5BGAME%5D%20%5BACTION_PLATFORMER%5D/doc/art/evidence/a1_concept_to_application_comparison.png"/>
  <text x="1224" y="871" class="cardTitle">KIRBY — P1 A P4</text>
  <text x="1224" y="899" class="status" fill="#ff6f91">ARQUIVO DE EVIDÊNCIA NEGATIVA</text>
  <text x="1224" y="930" class="body">Procedural → proposta HD → redução quantizada →</text>
  <text x="1224" y="954" class="body">master vetorial. Todas reprovadas visualmente.</text>
  <text x="1224" y="981" class="small">Lição P4: curva limpa não corrige anatomia ou acting incorretos.</text>

