  <text x="900" y="1150" class="status" fill="#a9d2ff">4 · NATIVE PIXEL</text>
  <text x="900" y="1177" class="small">reconstruir, não esmagar</text>
  <path d="M1108 1157 H1146" stroke="#7f8bab" stroke-width="4"/><path d="M1146 1157 l-12 -8 v16 z" fill="#7f8bab"/>

  <rect x="1154" y="1120" width="218" height="74" rx="12" fill="#303850"/>
  <text x="1172" y="1150" class="status" fill="#a9d2ff">5 · ARTEFATOS</text>
  <text x="1172" y="1177" class="small">clipping/pivot/deltas</text>
  <path d="M1380 1157 H1418" stroke="#7f8bab" stroke-width="4"/><path d="M1418 1157 l-12 -8 v16 z" fill="#7f8bab"/>

  <rect x="1426" y="1120" width="308" height="74" rx="12" fill="#255244"/>
  <text x="1444" y="1150" class="status" fill="#84efbe">6 · SGDK + BLASTEM</text>
  <text x="1444" y="1177" class="small">captura fresca antes do positivo</text>

  <text x="66" y="1246" class="body">Fixtures complementares: SMOKE_TEST (builder determinístico), SCENE_TILEMAP (dedup/flip/conflitos), FORGE_REFERENCE (contrato) e Celestial Revive (prova de que placeholder técnico não é identidade visual).</text>
  <text x="66" y="1284" class="body">Regra de decisão: arte tecnicamente válida pode continuar reprovada. Nenhuma proposta entra como final sem comparação fonte → asset → runtime e julgamento humano/perceptivo explícito.</text>
  <text x="66" y="1330" class="small">Escopo auditado: 10 iniciativas · 700 PNG/GIF/SVG · 166 lições documentadas · SGDK_Engines sem iniciativas gráficas.</text>
