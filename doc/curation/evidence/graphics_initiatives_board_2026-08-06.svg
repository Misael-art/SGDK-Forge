  <text x="56" y="899" class="status" fill="#57d19b">LAB FORTE / GATE PERCEPTIVO ABERTO</text>
  <text x="56" y="930" class="body">Fonte premium → compare-flat → tile-aware →</text>
  <text x="56" y="954" class="body">runtime → gate de screenshot → baseline seletiva.</text>
  <text x="56" y="981" class="small">Lição: PNG indexado ainda pode falhar por matte opaco no herói.</text>

  <rect x="620" y="594" width="560" height="410" rx="18" fill="#262c40" stroke="#f3b65f" stroke-width="3"/>
