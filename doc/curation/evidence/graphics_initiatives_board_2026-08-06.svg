  <text x="56" y="425" class="cardTitle">MARE BRAVA</text>
  <text x="56" y="453" class="status" fill="#57d19b">ROTA VISUAL-FIRST PREFERENCIAL</text>
  <text x="56" y="484" class="body">Art bible → modelo → lineart → key pose →</text>
  <text x="56" y="508" class="body">artifact/pivot/contato → cena modular.</text>
  <text x="56" y="535" class="small">Lição: personagem exige reconstrução; cenário tolera redução seletiva.</text>

