  <text x="640" y="484" class="body">v001–v012: procedural e downscale → modelo →</text>
  <text x="640" y="508" class="body">lineart nativa → strips e gates de fidelidade.</text>
  <text x="640" y="535" class="small">Lição: validade técnica não salva anatomia genérica ou blocada.</text>

